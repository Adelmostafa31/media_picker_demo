name: custom_media_picker
description: A Flutter package for picking images and videos from the device gallery with a custom UI, native Android/iOS access, and preview support.
homepage: https://github.com/Adelmostafa31/media_picker_demo
repository: https://github.com/Adelmostafa31/media_picker_demo
issue_tracker: https://github.com/Adelmostafa31/media_picker_demo/issues
version: 0.1.0

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  # Used ONLY for the full-screen video preview inside the picker.
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

topics:
  - media
  - picker
  - gallery
  - image
  - video
