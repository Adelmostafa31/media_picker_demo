name: custom_media_picker
description: A Flutter plugin for picking images and videos from the device gallery with a custom UI, native Android/iOS access, and preview support.
homepage: https://github.com/Adelmostafa31/media_picker_demo
repository: https://github.com/Adelmostafa31/media_picker_demo
issue_tracker: https://github.com/Adelmostafa31/media_picker_demo/issues
version: 0.2.0

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  # Used ONLY for the full-screen video preview inside the picker.
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.adelmostafa31.custom_media_picker
        pluginClass: CustomMediaPickerPlugin
      ios:
        pluginClass: CustomMediaPickerPlugin

# Rendered as a gallery on the package's pub.dev page.
screenshots:
  - description: The picker running on Android — grid layout, multi-select, send bar.
    path: doc/demo_android.gif
  - description: The picker running on iOS — sheet layout, albums tab, preview.
    path: doc/demo_ios.gif

topics:
  - media
  - picker
  - gallery
  - image
  - video
